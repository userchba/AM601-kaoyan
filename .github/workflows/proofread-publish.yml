name: Publish verified proofreading
on:
  push:
    branches: [master]
    paths: ['.github/workflows/proofread-publish.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply hash-checked source patch
        run: |
          python3 - <<'PY'
          import base64, lzma, hashlib, subprocess
          from pathlib import Path
          encoded = ''''''
          patch = lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '2bd8242c5cd13c8aabdb7e31337501a22d4d3cf79023b306ec79b692c7bc3151'
          path = Path('/tmp/verified-proofreading.patch')
          path.write_bytes(patch)
          subprocess.run(['git','apply','--index','--unidiff-zero','--check',str(path)],check=True)
          subprocess.run(['git','apply','--index','--unidiff-zero',str(path)],check=True)
          subprocess.run(['git','diff','--cached','--stat'],check=True)
          PY
      - name: Rebuild PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: compile.sh
          compiler: bash
          args: ""
          pre_compile: export PORTABLE_FONTS=1
          extra_system_packages: poppler-utils
      - name: Commit reviewed source and PDF to master
        run: |
          set -eu
          git fetch origin master
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git add -- '1/*.tex' style.cls compile.sh 601.pdf
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: proofread AM601 answers and conditions and rebuild PDF'
          git push origin HEAD:master
          git rev-parse HEAD > REVIEW_COMMIT.txt
          sha256sum 601.pdf > PDF_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AM601-reviewed-pdfs
          path: |
            601.pdf
            REVIEW_COMMIT.txt
            PDF_SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
